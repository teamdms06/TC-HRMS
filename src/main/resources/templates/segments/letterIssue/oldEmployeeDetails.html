            $("#uploadForm").on("submit", function (e) {
                e.preventDefault();

                let formData = new FormData(this);
                let modalEl = document.getElementById("uploadModal");

                let currentPercent = 0;
                let targetPercent = 0;
                let interval;

                function startAnimation() {
                    clearInterval(interval);

                    interval = setInterval(() => {
                        if (currentPercent < targetPercent) {
                            currentPercent++;
                            document.getElementById("swal-progress").innerHTML =
                                    `<b>${currentPercent}%</b> completed`;
                        }
                    }, 20); // speed of animation
                }

                $.ajax({
                    url: "uploadOldIssueLetterData",
                    type: "POST",
                    data: formData,
                    processData: false,
                    contentType: false,

                    xhr: function () {
                        let xhr = new window.XMLHttpRequest();

                        xhr.upload.addEventListener("progress", function (e) {
                            if (e.lengthComputable) {
                                targetPercent = Math.round((e.loaded / e.total) * 100);

                                if (Swal.isVisible()) {
                                    startAnimation();
                                } else {
                                    Swal.fire({
                                        title: "Uploading...",
                                        html: `<div id="swal-progress"><b>0%</b> completed</div>`,
                                        allowOutsideClick: false,
                                        didOpen: () => {
                                            Swal.showLoading();
                                        }
                                    });
                                }
                            }
                        });

                        return xhr;
                    },

                    success: function (res) {

                        clearInterval(interval);

                        if (res.status === "success") {

                            Swal.fire({
                                icon: "success",
                                title: "Success",
                                text: res.message,
                                timer: 1500,
                                showConfirmButton: false
                            });

                            $("#uploadForm")[0].reset();
                            $("#fileName").text("");


                            let modal = bootstrap.Modal.getInstance(modalEl);
                            if (modal)
                                modal.hide();
                            window.location.reload();

                        } else {

                            Swal.fire({
                                icon: "error",
                                title: "Error",
                                text: res.message
                            });
                        }
                    },

                    error: function () {

                        clearInterval(interval);

                        Swal.fire({
                            icon: "error",
                            title: "Upload Failed",
                            text: "Something went wrong!"
                        });
                    }
                });
            });

        </script>
        <script>
            const dropZone = document.getElementById("dropZone");
            const fileInput = document.getElementById("fileInput");
            const fileName = document.getElementById("fileName");

// Click to open file picker
            dropZone.addEventListener("click", () => fileInput.click());

// Drag over
            dropZone.addEventListener("dragover", (e) => {
                e.preventDefault();
                dropZone.classList.add("dragover");
            });

// Drag leave
            dropZone.addEventListener("dragleave", () => {
                dropZone.classList.remove("dragover");
            });

// Drop file
            dropZone.addEventListener("drop", (e) => {
                e.preventDefault();
                dropZone.classList.remove("dragover");

                const file = e.dataTransfer.files[0];
                fileInput.files = e.dataTransfer.files;

                fileName.textContent = "Selected: " + file.name;
            });

// Show selected file
            fileInput.addEventListener("change", () => {
                fileName.textContent = "Selected: " + fileInput.files[0].name;
            });

        </script>
