<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>TC-HRMS</title>
        <!-- plugins:css -->
        <link rel="stylesheet" href="/asset/vendors/mdi/css/materialdesignicons.min.css">
        <link rel="stylesheet" href="/asset/vendors/css/vendor.bundle.base.css">
        <!-- endinject -->
        <!-- Plugin css for this page -->
        <!-- End plugin css for this page -->
        <!-- inject:css -->
        <!-- endinject -->
        <!-- Layout styles -->
        <link rel="stylesheet" href="/asset/css/style.css">
        <style>
            .brand-logo {
                text-align: center;
            }

            .brand-logo img {
                display: inline-block;
                max-width: 150px; /* optional */
            }
            .password-field {
                position: relative;
            }
            .password-toggle {
                position: absolute;
                top: 50%;
                right: 14px;
                transform: translateY(-50%);
                border: 0;
                background: transparent;
                color: #6c757d;
                cursor: pointer;
                padding: 0;
                line-height: 1;
            }
            .password-field .form-control {
                padding-right: 44px;
            }
        </style>
        <!-- End layout styles -->
        <!--    <link rel="shortcut icon" href="/asset/images/favicon.ico" />-->
    </head>
    <body>
        <div class="container-scroller">
            <div class="container-fluid page-body-wrapper full-page-wrapper">
                <div class="content-wrapper d-flex align-items-center auth">
                    <div class="row flex-grow">
                        <div class="col-lg-4 mx-auto">
                            <div class="auth-form-light text-left p-5">
                                <div class="brand-logo text-center">
                                    <img src="/asset/images/TClogo-final.png" class="img-fluid">
                                </div>
                                <!--<img src="../static/asset/images/TCLogo.png" alt=""/>-->
                                <!--<h4>Hello! let's get started</h4>-->
                                <h6 class="font-weight-light">Sign in to continue.</h6>
                                <form class="pt-3" action="loginFormData" method="POST">
                                    <div class="form-group">
                                        <input type="text" class="form-control form-control-lg" id="exampleInputEmail1" name="username" placeholder="Username">
                                    </div>
                                    <div class="form-group password-field">
                                        <input type="password" class="form-control form-control-lg" id="exampleInputPassword1" name="password" placeholder="Password">
                                        <button type="button" class="password-toggle" data-password-toggle="exampleInputPassword1" aria-label="Show password">
                                            <i class="mdi mdi-eye-outline"></i>
                                        </button>
                                    </div>
                                    <div class="mt-3">
                                        <button class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn">SIGN IN</button>
                                    </div>
                                    <div class="my-2 d-flex justify-content-between align-items-center">
                                        <div class="form-check">
                                            <label class="form-check-label text-muted">
                                                <input type="checkbox" class="form-check-input"> Keep me signed in </label>
                                        </div>
                                        <a href="/forgot-password" class="auth-link text-black">Forgot password?</a>
                                    </div>
                                    <!--                  <div class="mb-2">
                                                        <button type="button" class="btn btn-block btn-facebook auth-form-btn">
                                                          <i class="mdi mdi-facebook me-2"></i>Connect using facebook </button>
                                                      </div>-->
                                    <!--<div class="text-center mt-4 font-weight-light"> Don't have an account? <a href="register.html" class="text-primary">Create</a>-->
                                    <!--</div>-->
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- content-wrapper ends -->
            </div>
            <!-- page-body-wrapper ends -->
        </div>
        <!-- container-scroller -->
        <!-- plugins:js -->
        <script src="/asset/vendors/js/vendor.bundle.base.js"></script>
        <!-- endinject -->
        <!-- Plugin js for this page -->
        <!-- End plugin js for this page -->
        <!-- inject:js -->
        <script src="/asset/js/off-canvas.js"></script>
        <script src="/asset/js/hoverable-collapse.js"></script>
        <script src="/asset/js/misc.js"></script>
        <script>
            document.querySelectorAll('[data-password-toggle]').forEach(function (button) {
                button.addEventListener('click', function () {
                    var input = document.getElementById(button.getAttribute('data-password-toggle'));
                    var icon = button.querySelector('i');
                    var showPassword = input.type === 'password';
                    input.type = showPassword ? 'text' : 'password';
                    button.setAttribute('aria-label', showPassword ? 'Hide password' : 'Show password');
                    icon.className = showPassword ? 'mdi mdi-eye-off-outline' : 'mdi mdi-eye-outline';
                });
            });
        </script>
        <!-- endinject -->
    </body>
</html>
