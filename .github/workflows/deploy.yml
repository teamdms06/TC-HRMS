name: Deploy HRM Interview to Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EB_APPLICATION_NAME: HRM-Interview
  EB_ENVIRONMENT_NAME: HRM-Interview-env
  S3_BUCKET: elasticbeanstalk-us-east-1-056829876981

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build WAR file
        run: mvn clean package -DskipTests

      - name: Create deployment ZIP
        run: |
          VERSION_LABEL=HRM-Interview-${{ github.run_number }}
          echo "VERSION_LABEL=$VERSION_LABEL" >> $GITHUB_ENV

          mkdir deploy
          cp target/*.war deploy/

          if [ -d "platform" ]; then
            cp -r platform deploy/platform
          fi

          cd deploy
          zip -r ../$VERSION_LABEL.zip .
          cd ..

          echo "ZIP_FILE=$VERSION_LABEL.zip" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload ZIP to Elastic Beanstalk S3 bucket
        run: |
          aws s3 cp $ZIP_FILE s3://${{ env.S3_BUCKET }}/github-deployments/$ZIP_FILE

      - name: Create Elastic Beanstalk version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-label "${{ env.VERSION_LABEL }}" \
            --source-bundle S3Bucket="${{ env.S3_BUCKET }}",S3Key="github-deployments/${{ env.ZIP_FILE }}"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENVIRONMENT_NAME }}" \
            --version-label "${{ env.VERSION_LABEL }}"
