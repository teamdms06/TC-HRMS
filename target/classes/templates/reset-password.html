<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>TC-HRMS</title>
        <link rel="stylesheet" href="/asset/vendors/mdi/css/materialdesignicons.min.css">
        <link rel="stylesheet" href="/asset/vendors/css/vendor.bundle.base.css">
        <link rel="stylesheet" href="/asset/css/style.css">
        <style>
            .brand-logo {
                text-align: center;
            }
            .brand-logo img {
                display: inline-block;
                max-width: 150px;
            }
            .password-field {
                position: relative;
            }
            .password-toggle {
                position: absolute;
                top: 50%;
                right: 14px;
                transform: translateY(-50%);
                border: 0;
                background: transparent;
                color: #6c757d;
                cursor: pointer;
                padding: 0;
                line-height: 1;
            }
            .password-field .form-control {
                padding-right: 44px;
            }
        </style>
    </head>
    <body>
        <div class="container-scroller">
            <div class="container-fluid page-body-wrapper full-page-wrapper">
                <div class="content-wrapper d-flex align-items-center auth">
                    <div class="row flex-grow">
                        <div class="col-lg-4 mx-auto">
                            <div class="auth-form-light text-left p-5">
                                <div class="brand-logo text-center">
                                    <img src="/asset/images/TClogo-final.png" class="img-fluid">
                                </div>
                                <h6 class="font-weight-light">Create a new password.</h6>
                                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                                <form class="pt-3" action="/reset-password" method="POST" th:if="${token}">
                                    <input type="hidden" name="token" th:value="${token}">
                                    <div class="form-group password-field">
                                        <input type="password" class="form-control form-control-lg" id="newPassword" name="password" placeholder="New password" required>
                                        <button type="button" class="password-toggle" data-password-toggle="newPassword" aria-label="Show password">
                                            <i class="mdi mdi-eye-outline"></i>
                                        </button>
                                    </div>
                                    <div class="form-group password-field">
                                        <input type="password" class="form-control form-control-lg" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
                                        <button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="Show password">
                                            <i class="mdi mdi-eye-outline"></i>
                                        </button>
                                    </div>
                                    <div class="mt-3">
                                        <button class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn">RESET PASSWORD</button>
                                    </div>
                                </form>
                                <div class="text-center mt-4 font-weight-light">
                                    <a href="/login" class="text-primary">Back to login</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="/asset/vendors/js/vendor.bundle.base.js"></script>
        <script src="/asset/js/off-canvas.js"></script>
        <script src="/asset/js/hoverable-collapse.js"></script>
        <script src="/asset/js/misc.js"></script>
        <script>
            document.querySelectorAll('[data-password-toggle]').forEach(function (button) {
                button.addEventListener('click', function () {
                    var input = document.getElementById(button.getAttribute('data-password-toggle'));
                    var icon = button.querySelector('i');
                    var showPassword = input.type === 'password';
                    input.type = showPassword ? 'text' : 'password';
                    button.setAttribute('aria-label', showPassword ? 'Hide password' : 'Show password');
                    icon.className = showPassword ? 'mdi mdi-eye-off-outline' : 'mdi mdi-eye-outline';
                });
            });
        </script>
    </body>
</html>
