<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>TC-HRMS</title>
        <link rel="stylesheet" href="/asset/vendors/mdi/css/materialdesignicons.min.css">
        <link rel="stylesheet" href="/asset/vendors/css/vendor.bundle.base.css">
        <link rel="stylesheet" href="/asset/css/style.css">
        <style>
            .brand-logo {
                text-align: center;
            }
            .brand-logo img {
                display: inline-block;
                max-width: 150px;
            }
        </style>
    </head>
    <body>
        <div class="container-scroller">
            <div class="container-fluid page-body-wrapper full-page-wrapper">
                <div class="content-wrapper d-flex align-items-center auth">
                    <div class="row flex-grow">
                        <div class="col-lg-4 mx-auto">
                            <div class="auth-form-light text-left p-5">
                                <div class="brand-logo text-center">
                                    <img src="/asset/images/TClogo-final.png" class="img-fluid">
                                </div>
                                <h6 class="font-weight-light">Enter your email to receive a password reset link.</h6>
                                <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>
                                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                                <form class="pt-3" action="/forgot-password" method="POST">
                                    <div class="form-group">
                                        <input type="email" class="form-control form-control-lg" name="email" placeholder="Email" required>
                                    </div>
                                    <div class="mt-3">
                                        <button class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn">SEND RESET LINK</button>
                                    </div>
                                    <div class="text-center mt-4 font-weight-light">
                                        <a href="/login" class="text-primary">Back to login</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="/asset/vendors/js/vendor.bundle.base.js"></script>
        <script src="/asset/js/off-canvas.js"></script>
        <script src="/asset/js/hoverable-collapse.js"></script>
        <script src="/asset/js/misc.js"></script>
    </body>
</html>
