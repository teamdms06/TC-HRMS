<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>TC-HRMS Report</title>
        <!-- plugins:css -->
        <link rel="stylesheet" href="asset/vendors/mdi/css/materialdesignicons.min.css">
        <link rel="stylesheet" href="asset/vendors/css/vendor.bundle.base.css">
        <!-- endinject -->
        <!-- Plugin css for this page -->
        <!-- End plugin css for this page -->
        <!-- inject:css -->
        <!-- endinject -->
        <!-- Layout styles -->
        <link rel="stylesheet" href="asset/css/style.css">
        <!-- End layout styles -->
        <link rel="shortcut icon" href="/asset/images/favicon.ico" />
    </head>
    <body>
        <div class="container-scroller">

            <div th:replace="fragments/navbar"></div>
            <!-- partial:partials/_navbar.html -->

            <!-- partial -->
            <div class="container-fluid page-body-wrapper">
                <div th:replace="fragments/sidebar"></div>
                <!-- partial:partials/_sidebar.html -->

                <!-- partial -->
                <div class="main-panel">
                    <div class="content-wrapper">
                        <div class="page-header">
                            <h3 class="page-title">
                                <span class="page-title-icon bg-gradient-primary text-white me-2">
                                    <i class="mdi mdi-file-excel"></i>
                                </span>Report
                            </h3>
                            <nav aria-label="breadcrumb">
                                <ul class="breadcrumb">
                                    <li class="breadcrumb-item active" aria-current="page">
                                        <span></span>Overview <i class="mdi mdi-alert-circle-outline icon-sm text-primary align-middle"></i>
                                    </li>
                                </ul>
                            </nav>
                        </div>

                        <div class="row">
                            <div class="col-12 grid-margin">
                                <div class="card">
                                    <div class="card-body">
                                        <h4 class="card-title">Report Section</h4>

                                        <form action="getExcelReport" method="GET">

                                            <div class="row">

                                                <!-- FILTER -->
                                                <div class="col-md-3">
                                                    <div class="form-group">
                                                        <label>Filter</label>
                                                        <select name="filter" id="filterType" class="form-control" required>
                                                            <option value="">Select</option>
                                                            <option value="interview">Interview</option>
                                                            <option value="addsLead">Adds Lead</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <!-- STATUS (Only for Adds Lead) -->
                                                <div class="col-md-3" id="statusDiv" style="display:none;">
                                                    <div class="form-group">
                                                        <label>Status</label>
                                                        <select name="status" class="form-control">
                                                            <option value="">Select Status</option>
                                                            <option value="All">All</option>
                                                            <option value="Interested">Interested</option>
                                                            <option value="Not Interested">Not Interested</option>
                                                            <option value="Under followUp">Under followUp</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <!-- START DATE -->
                                                <div class="col-md-3">
                                                    <div class="form-group">
                                                        <label>Start Date</label>
                                                        <input class="form-control" type="date" name="startDate" required/>
                                                    </div>
                                                </div>

                                                <!-- END DATE -->
                                                <div class="col-md-3">
                                                    <div class="form-group">
                                                        <label>End Date</label>
                                                        <input class="form-control" type="date" name="endDate" required/>
                                                    </div>
                                                </div>

                                                <!-- BUTTON -->
                                                <div class="col-md-3">
                                                    <div class="form-group mt-4">
                                                        <button type="submit" class="btn btn-outline-success btn-sm">
                                                            Get Report
                                                        </button>
                                                    </div>
                                                </div>

                                            </div>

                                        </form>

                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    <!-- content-wrapper ends -->
                    <!-- partial:partials/_footer.html -->
                    <div th:replace="fragments/footer"></div>
                    <!-- partial -->
                </div>
                <!-- main-panel ends -->
            </div>
            <!-- page-body-wrapper ends -->
        </div>
        <!-- container-scroller -->
        <!-- plugins:js -->
        <script src="asset/vendors/js/vendor.bundle.base.js"></script>
        <!-- endinject -->
        <!-- Plugin js for this page -->
        <script src="asset/vendors/chart.js/Chart.min.js"></script>
        <script src="asset/js/jquery.cookie.js" type="text/javascript"></script>
        <!-- End plugin js for this page -->
        <!-- inject:js -->
        <script src="asset/js/off-canvas.js"></script>
        <script src="asset/js/hoverable-collapse.js"></script>
        <script src="asset/js/misc.js"></script>
        <!-- endinject -->
        <!-- Custom js for this page -->
        <script src="asset/js/dashboard.js"></script>
        <script src="asset/js/todolist.js"></script>
        <script>
            document.getElementById("filterType").addEventListener("change", function () {
                let value = this.value;
                let statusDiv = document.getElementById("statusDiv");

                if (value === "addsLead") {
                    statusDiv.style.display = "block";
                } else {
                    statusDiv.style.display = "none";
                }
            });
        </script>

    </body>
</html>
