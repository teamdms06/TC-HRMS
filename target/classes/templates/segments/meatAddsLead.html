        <script type="text/javascript">
            $(document).ready(function () {
                $('#dataTableId').DataTable();
            });
            function getMetaAddsDeatails(id) {
                let row = document.getElementById(id);
                let status = row.getAttribute("data-status");
                // alert(id);
                Swal.fire({
                    title: 'Loading...',
                    text: 'Fetching Lead Details...',
                    allowOutsideClick: false,
                    allowEscapeKey: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });
//                setTimeout(() => {
                    window.location.href = "getMetaAddsDeatails?id=" + id + "&status=" + status;
//                }, 200);
            }

            function refreshData() {
//         alert()
                Swal.fire({
                    title: 'Are you sure?',
                    text: 'Do you want to refresh data from Google Sheets?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Yes, Refresh',
                    cancelButtonText: 'Cancel'
                }).then((result) => {

                    if (result.isConfirmed) {

                        Swal.fire({
                            title: 'Refreshing...',
                            text: 'Please wait',
                            allowOutsideClick: false,
                            didOpen: () => {
                                Swal.showLoading();
                            }
                        });

                        $.ajax({
                            url: 'syncData',
                            type: 'get',
                            success: function (res) {

                                Swal.close();

                                if (res === "success") {
                                    Swal.fire({
                                        icon: 'success',
                                        title: 'Done!',
                                        text: 'Data refreshed successfully'
                                    });
                                    window.location.reload();
                                } else {
                                    Swal.fire({
                                        icon: 'error',
                                        title: 'Failed',
                                        text: 'Something went wrong'
                                    });
                                }
                            },
                            error: function () {
                                Swal.fire({
                                    icon: 'error',
                                    title: 'Error',
                                    text: 'Server error'
                                });
                            }
                        });
                    }
                });
            }
           
        </script>
