            //it for more than 2 mb pdf file 
            function base64ToBlob(base64, mimeType = "application/octet-stream") {
//                const binStr = atob(base64);
//                const len = binStr.length;
//                const arr = new Uint8Array(len);
//                for (let i = 0; i < len; i++) {
//                    arr[ i ] = binStr.charCodeAt(i);
//                }
//                return new Blob([arr], {type: type});
                const byteCharacters = atob(base64);
                const byteArrays = [];
                for (let i = 0; i < byteCharacters.length; i += 512) {
                    const slice = byteCharacters.slice(i, i + 512);
                    const byteNumbers = new Array(slice.length);
                    for (let j = 0; j < slice.length; j++) {
                        byteNumbers[j] = slice.charCodeAt(j);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    byteArrays.push(byteArray);
                }
                return new Blob(byteArrays, {type: mimeType});
            }

        <script>

            // AUTO CALC FROM CTC
            document.getElementById("ctc").addEventListener("input", function () {

                let ctc = parseFloat(this.value) || 0;
                let basic = ctc * 0.5;
                let hra = ctc * 0.25;
//                let conv = parseFloat(document.getElementById("conv").value) || 600;
                let conv = ctc * 0.1;
//                let medical = parseFloat(document.getElementById("medical").value) || 500;
                let medical = ctc * 0.05;
                let special = ctc - (basic + hra + conv + medical);
                document.getElementById("basic").value = basic.toFixed(0);
                document.getElementById("hra").value = hra.toFixed(0);
                document.getElementById("conv").value = conv.toFixed(0);
                document.getElementById("medical").value = medical.toFixed(0);
                document.getElementById("special").value = special.toFixed(0);
                document.getElementById("gross").value = ctc.toFixed(0);
                calculateAll();
            });
            // TOTAL + NET CALC
            function calculateAll() {

                let gross = parseFloat(document.getElementById("gross").value) || 0;
                let pfEmp = parseFloat(document.getElementById("pfEmployee").value) || 0;
                let pt = parseFloat(document.getElementById("pt").value) || 0;
                let insurance = parseFloat(document.getElementById("insurance").value) || 0;
                let totalDeduction = pfEmp * 2 + pt + insurance;
                let netSalary = gross - totalDeduction;
                document.getElementById("totalDeduction").value = totalDeduction.toFixed(0);
                document.getElementById("netSalary").value = netSalary.toFixed(0);
            }

            // AUTO UPDATE ON CHANGE
            document.querySelectorAll("#pfEmployee, #pt, #insurance").forEach(input => {
                input.addEventListener("input", calculateAll);
            });
        </script>

        <script>
            function numberToWordsIndian(num) {
                const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine",
                    "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen",
                    "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
                const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty",
                    "Sixty", "Seventy", "Eighty", "Ninety"];
                const convert = (n) => {
                    if (n < 20)
                        return ones[n];
                    if (n < 100)
                        return tens[Math.floor(n / 10)] + " " + ones[n % 10];
                    return ones[Math.floor(n / 100)] + " Hundred " + convert(n % 100);
                };

                if (num === 0)
                    return "zero";

                let result = "";

                if (num >= 100000) {
                    result += convert(Math.floor(num / 100000)) + " lakh ";
                    num %= 100000;
                }

                if (num >= 1000) {
                    result += convert(Math.floor(num / 1000)) + " thousand ";
                    num %= 1000;
                }

                if (num > 0) {
                    result += convert(num);
                }

                return result.trim().replace(/\s+/g, " ");
            }

            // 🔥 Live typing
            document.getElementById("offSal").addEventListener("input", function () {
                const value = this.value;
                if (value === "") {
                    document.getElementById("output").innerText = "";
                    return;
                }

                document.getElementById("output").innerText = numberToWordsIndian(Number(value));
            });
        </script>
