<div th:fragment="newClientform">

    <div class="row p-3">
        <div class="col-sm">

            <div class="row">
                <div class="col-sm-12">
                    <div class="card mt-2" >
                        <div class="card-header mb-2 p-2">
                            <div class="row">
                                <!--<div class="col-sm-6">-->
                                <!--<div class="col-md-8"><h6> <i class="bi bi-patch-check"></i> Client Agreement Form </h6></div>-->
                                <!--<div class="col-md-4"><input type="checkbox" id="checkbox" name="undefined" class="undefined" value="undefined" data-parsley-multiple="undefined" style="margin-left: 120px"> Undefined Customer</div>-->


                                <!--</div>-->
                            </div>
                        </div>
                        <div class="card-body ">
                            <form id="saveClientAgreementForm"  name="saveClientAgreementForm" action="saveClientAgreementForm" method="POST" enctype="multipart/form-data">
                                <div class="row g-3" >
                                    <div class="col-md-4">
                                        <label  class="form-label">Client Name</label>
                                        <input type="tel" class="form-control form-control-sm comman" name="clientName" id="clientName"  required="required">
                                    </div>
                                    <div class="col-md-4">
                                        <label  class="form-label">Client Contact Person Name</label>
                                        <input type="tel" class="form-control form-control-sm" name="contactPersonName" id="contactPersonName"  required="required">
                                    </div>
                                    <div class="col-md-4">
                                        <label  class="form-label">contact Number</label>
                                        <input type="tel" class="form-control form-control-sm" name="contactPersonContact" id="contactPersonContact"  required="required">
                                    </div>
                                </div>
                                <div class="row g-3" style="padding-top: 1rem">
                                    <div class="col-md-3">
                                        <label  class="form-label">Client Email Id</label>
                                        <input type="tel" class="form-control form-control-sm comman" name="clientEmailId" id="clientEmailId"  required="required">
                                    </div>
                                    <div class="col-md-3">
                                        <label  class="form-label">Agreement Start Date</label>
                                        <input type="date" class="form-control form-control-sm comman" name="agreementStartDate" id="agreementStartDate"  required="required" onchange="getYear(this.value)">
                                    </div>
                                    <div class="col-md-3">
                                        <label  class="form-label">Agreement Year</label>
                                        <input type="tel" class="form-control form-control-sm comman" name="agreementYear" id="agreementYear"  required="required">
                                    </div>
                                    <div class="col-md-3">
                                        <label  class="form-label">Agreement Renewal Date</label>
                                        <input type="date" class="form-control form-control-sm comman" name="agreementRenewalDate" id="agreementRenewalDate"  required="required">
                                    </div>


                                </div>
                                <div class="row g-3" style="padding-top: 1rem" >
                                    <div class="col-md-3">
                                        <label  class="form-label">Agreement Expiry Date</label>
                                        <input type="date" class="form-control form-control-sm comman" name="agreementExpiryDate" id="agreementExpiryDate"  required="required">
                                    </div>
                                    <div class="col-md-3">
                                        <label  class="form-label">TC Contact Person Name</label>
                                        <input type="tel" class="form-control form-control-sm comman" name="tcContactPersonName" id="tcContactPersonName"  required="required">
                                    </div>
                                    <div class="col-md-3">
                                        <label  class="form-label">TC Contact Person Number</label>
                                        <input type="tel" class="form-control form-control-sm comman" name="tcContactPersonNumber" id="tcContactPersonNumber"  required="required">
                                    </div>
                                    <div class="col-md-3">
                                        <label  class="form-label">TC Contact Email Id</label>
                                        <input type="tel" class="form-control form-control-sm comman" name="tcContactPersonEmail" id="tcContactPersonEmail"  required="required">
                                    </div>


                                </div>

                                <div class="row g-3" style="padding-top: 1rem">
                                    <div class="col-md-8">
                                        <label  class="form-label">Agreement Copy</label>
                                        <input type="file" class="form-control form-control-sm" name="file" id="clientAgreement"  required="required">
                                    </div>
                                </div>
                                <div class="row g-3" style="padding-top: 1.5rem">
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-success">Save</button>
                                        <button type="reset" class="btn btn-secondary">Reset</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="row p-3">
        <div class="col-sm">
            <div id="crfActionsBody"></div>
        </div>
    </div>
    <script type="text/javascript">

    </script>

    <!--<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>-->
</div>
