       <script>
function loadData(button) {

    const modal = document.getElementById('modifyModal');

    // 🔥 Mapping (lowercase → correct field name)
    const fieldMap = {
        employeeid: "employeeId",
        employeename: "employeeName",
        dateofbirth: "dateOfBirth",
        dateofjoining: "dateOfJoining",
        emailid: "emailId",
        contactnumber: "contactNumber",
        employeeaddress: "employeeAddress",
        offerletterstatus: "offerLetterStatus",
        salbifurcationid: "salBifurcationId",
        specialallowance: "specialAllowance",
        grosssalary: "grossSalary",
        employeepf: "employeePf",
        employerpf: "employerPf",
        professionaltax: "professionalTax",
        insurancededuction: "insuranceDeduction",
        totaldeduction: "totalDeduction",
        netsalary: "netSalary"
    };

    Array.from(button.attributes).forEach(attr => {

        if (attr.name.startsWith('data-')) {

            let key = attr.name.replace('data-', '').toLowerCase();

            // 🔥 Convert using map OR fallback
            key = fieldMap[key] || key;

            const input = modal.querySelector(`[name="${key}"]`);

            if (input) {

                if (input.type === "date" && attr.value) {
                    input.value = attr.value.split('T')[0];
                } else {
                    input.value = attr.value;
                }

            } else {
                console.warn("❌ Not found:", key);
            }
        }
    });
}
</script>
<script>
function sendOldEmpOLMail(button) {

    let id = $(button).data("id");

    // 🔥 Confirmation popup
    Swal.fire({
        title: "Are you sure?",
        text: "Do you want to send email?",
        icon: "question",
        showCancelButton: true,
        confirmButtonText: "Yes, Send",
        cancelButtonText: "Cancel"
    }).then((result) => {

        if (result.isConfirmed) {

            // Disable button
            $(button).prop("disabled", true)
                     .html('<span class="spinner-border spinner-border-sm"></span> Sending...');

            $.ajax({
                url: '/send-single-mail',
                type: 'POST',
                data: { id: id },

                success: function(response) {

                    Swal.fire({
                        icon: "success",
                        title: "Success",
                        text: response,
                        timer: 2000,
                        showConfirmButton: false
                    });

                    $(button).html("Sent");
                },

                error: function(xhr) {

                    Swal.fire({
                        icon: "error",
                        title: "Failed",
                        text: xhr.responseText || "Something went wrong"
                    });

                    $(button).prop("disabled", false)
                             .text("Send Mail");
                }
            });

        }
    });
}
</script>
